events {
    worker_connections 1024;
}

http {
    # Cấu hình chung
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;   # tăng nếu backend upload file lớn

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Server cho Frontend (website chính)
    server {
        listen 80;
        server_name sharingfile.nghiaomg.xyz;

        # Nếu frontend là static site (React, Vue, Vite...)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server cho Admin
    server {
        listen 80;
        server_name sharingfile-admin.nghiaomg.xyz;

        location / {
            proxy_pass http://admin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server cho Backend (API)
    server {
        listen 80;
        server_name sharingfile-be.nghiaomg.xyz;

        location / {
            proxy_pass http://backend:8080;   # ← thay 8080 bằng port backend thật
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Quan trọng cho API (WebSocket, long request)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
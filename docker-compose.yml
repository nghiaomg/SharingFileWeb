version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: sharingfile-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - sharingfile-network
    depends_on:
      - mongodb
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: sharingfile-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    networks:
      - sharingfile-network
    expose:
      - "3000"

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: https://sharingfile-be.nghiaomg.xyz
    container_name: sharingfile-admin
    restart: unless-stopped
    networks:
      - sharingfile-network
    expose:
      - "80"

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - sharingfile-network

  mongodb:
    image: mongo:latest
    container_name: sharingfile-mongodb
    restart: unless-stopped
    command: mongod --port 27018
    ports:
      - "27018:27018"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sharingfile-network

networks:
  sharingfile-network:
    name: sharingfile-network
    driver: bridge

volumes:
  mongodb_data:
services:
  backend:
    build:
      context: ./backend
    container_name: sharingfile-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Use Spring Boot's native env-to-property binding.
      # Docker's DNS resolves "mongodb" to the container's internal IP
      # on the sharingfile-network. The .env file is loaded first (env_file),
      # then these explicit values override any default in application.properties.
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/
      SPRING_DATA_MONGODB_DATABASE: sharingfileweb
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - sharingfile-network
    depends_on:
      - mongodb
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: sharingfile-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    networks:
      - sharingfile-network
    expose:
      - "3000"

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sharingfile-network

  mongodb:
    image: mongo:latest
    container_name: sharingfile-mongodb
    restart: unless-stopped
    command: mongod --port 27017
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sharingfile-network

networks:
  sharingfile-network:
    name: sharingfile-network
    driver: bridge

volumes:
  mongodb_data:
spring.application.name=sharingfileweb

# ─── Springdoc OpenAPI (Swagger UI) ───────────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Point to the bundled openapi.yaml for enhanced docs
springdoc.swagger-ui.specUrl=/openapi.yaml
springdoc.use-fqn=true

# Database config (MongoDB) sẽ được Load trực tiếp qua System.setProperty trong SharingfilewebApplication

# JWT Config
sharingfileweb.app.jwtSecret=${JWT_SECRET}
sharingfileweb.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
sharingfileweb.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=1024MB

# Google OAuth2
sharingfileweb.app.googleClientId=${GOOGLE_CLIENT_ID}
sharingfileweb.app.googleClientSecret=${GOOGLE_CLIENT_SECRET}

# GitHub OAuth2
sharingfileweb.app.githubClientId=${GITHUB_CLIENT_ID}
sharingfileweb.app.githubClientSecret=${GITHUB_CLIENT_SECRET}

# Dribbble OAuth2
sharingfileweb.app.dribbbleClientId=${DRIBBBLE_CLIENT_ID}
sharingfileweb.app.dribbbleClientSecret=${DRIBBBLE_CLIENT_SECRET}

# Zalo OAuth2
sharingfileweb.app.zaloAppId=${ZALO_APP_ID}
sharingfileweb.app.zaloSecretKey=${ZALO_SECRET_KEY}

# Cloudflare Turnstile
cloudflare.turnstile.secret=${TURNSTILE_SECRET:0x4AAAAAACwRZ49v39ZiG29Ak7mzAo4JUlI}

# Backblaze B2 Cloud Storage
b2.application-key-id=${B2_APPLICATION_KEY_ID}
b2.application-key=${B2_APPLICATION_KEY}
b2.bucket-name=${B2_BUCKET_NAME}
b2.bucket-id=${B2_BUCKET_ID}
b2.download-url-expiration-seconds=${B2_DOWNLOAD_URL_EXPIRATION:3600}

# Presigned URL Expiration (Private Bucket Access Model)
storage.presigned.preview=5m
storage.presigned.download=15m
storage.presigned.share-link-default=1h

# SePay Payment
sepay.token=${SEPAY_TOKEN}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER}
sepay.bank-name=${SEPAY_BANK_NAME}

# Logging Configuration
logging.file.name=logs/social-login-errors.log
logging.file.path=logs
logging.level.org.springframework.web=INFO
logging.level.com.sharingfileweb=DEBUG
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token nhận được từ API `/api/auth/signin`.
        Format: `Authorization: Bearer <accessToken>`
  schemas:
    LoginRequest:
      $ref: ./components/schemas/Auth.yaml#/LoginRequest
    SignupRequest:
      $ref: ./components/schemas/Auth.yaml#/SignupRequest
    GoogleLoginRequest:
      $ref: ./components/schemas/Auth.yaml#/GoogleLoginRequest
    TokenRefreshRequest:
      $ref: ./components/schemas/Auth.yaml#/TokenRefreshRequest
    JwtResponse:
      $ref: ./components/schemas/Auth.yaml#/JwtResponse
    TokenRefreshResponse:
      $ref: ./components/schemas/Auth.yaml#/TokenRefreshResponse
    FileResponse:
      type: object
      properties:
        id:
          type: string
          description: ID của tệp
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        name:
          type: string
          description: Tên tệp gốc
          example: report.pdf
        type:
          type: string
          description: MIME type
          example: application/pdf
        size:
          type: integer
          format: int64
          description: Kích thước (bytes)
          example: 2048576
        folderId:
          type: string
          nullable: true
          description: ID thư mục chứa (null = root)
          example: 64f1a2b3c4d5e6f7a8b9c0d2
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tải lên
          example: '2024-01-15T10:30:00Z'
        isPublic:
          type: boolean
          description: Có phải file công khai không
          example: false
        accessMode:
          type: string
          enum:
            - PRIVATE
            - PUBLIC
            - RESTRICTED
          description: Chế độ truy cập
          example: PRIVATE
        sharedEmails:
          type: array
          items:
            type: string
          description: Danh sách email được chia sẻ
          example:
            - colleague@example.com
        shareExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Ngày hết hạn chia sẻ
          example: '2024-02-15T10:30:00Z'
    ShareFileRequest:
      type: object
      properties:
        accessMode:
          type: string
          enum:
            - PRIVATE
            - PUBLIC
            - RESTRICTED
          description: Chế độ truy cập
          example: RESTRICTED
        sharedEmails:
          type: array
          items:
            type: string
          description: Danh sách email người được chia sẻ
          example:
            - colleague@example.com
        expiresInDays:
          type: integer
          format: int64
          nullable: true
          description: Số ngày hết hạn chia sẻ (null = vĩnh viễn)
          example: 30
    RenameFileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Tên mới của tệp
          example: report_v2.pdf
    UploadStatusResponse:
      type: object
      properties:
        uploadedChunks:
          type: array
          items:
            type: integer
          description: Danh sách chỉ số chunk đã tải thành công
          example:
            - 0
            - 1
            - 2
            - 3
    DownloadUrlResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned URL để tải xuống
          example: https://f005.backblazeb2.com/file/...
        fileName:
          type: string
          description: Tên tệp
          example: report.pdf
        fileType:
          type: string
          description: MIME type
          example: application/pdf
        fileSize:
          type: integer
          format: int64
          description: Kích thước (bytes)
          example: 2048576
    FolderResponse:
      type: object
      properties:
        id:
          type: string
          description: ID thư mục
          example: 64f1a2b3c4d5e6f7a8b9c0d2
        name:
          type: string
          description: Tên thư mục
          example: Project Documents
        parentId:
          type: string
          nullable: true
          description: ID thư mục cha (null = root)
          example: null
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tạo
          example: '2024-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Thời điểm cập nhật gần nhất
          example: '2024-01-16T08:00:00Z'
    CreateFolderRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Tên thư mục mới
          example: New Folder
        parentId:
          type: string
          nullable: true
          description: ID thư mục cha (null hoặc bỏ trống = root)
          example: null
    UpdateFolderRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Tên mới của thư mục
          example: Renamed Folder
    ResolvePathRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Tên thư mục cần tìm
          example: Project
        parentId:
          type: string
          nullable: true
          description: ID thư mục cha để tìm kiếm trong đó
          example: 64f1a2b3c4d5e6f7a8b9c0d2
    InternalShareRequest:
      type: object
      required:
        - fileId
        - emails
      properties:
        fileId:
          type: string
          description: ID của tệp/thư mục cần chia sẻ
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        emails:
          type: array
          items:
            type: string
            format: email
          description: Danh sách email người được chia sẻ
          example:
            - colleague@example.com
        permission:
          type: string
          enum:
            - VIEW
            - DOWNLOAD
          description: Quyền truy cập
          example: VIEW
    UpdatePermissionRequest:
      type: object
      properties:
        permission:
          type: string
          enum:
            - VIEW
            - DOWNLOAD
          description: Quyền truy cập mới
          example: DOWNLOAD
    CreateShareLinkRequest:
      type: object
      required:
        - fileId
      properties:
        fileId:
          type: string
          description: ID của tệp/thư mục cần chia sẻ
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        permission:
          type: string
          enum:
            - VIEW
            - DOWNLOAD
          description: Quyền khi truy cập qua link
          example: VIEW
        password:
          type: string
          nullable: true
          description: Mật khẩu bảo vệ link (null = không có mật khẩu)
          example: secret123
        expiresInDays:
          type: integer
          format: int64
          nullable: true
          description: Số ngày hết hạn (null = không hết hạn)
          example: 7
    UpdateShareLinkRequest:
      type: object
      properties:
        permission:
          type: string
          enum:
            - VIEW
            - DOWNLOAD
          nullable: true
          description: Quyền mới (null = giữ nguyên)
          example: DOWNLOAD
        password:
          type: string
          nullable: true
          description: Mật khẩu mới (null = giữ, empty = xóa mật khẩu)
        expiresInDays:
          type: integer
          format: int64
          nullable: true

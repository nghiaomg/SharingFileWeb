# ─── SharingFileWeb OpenAPI Specification ─────────────────────────────────────────
# Version: 1.0.0
# Encoding: UTF-8
#
# 📦 Bundle command (sau khi build, ghép lại thành 1 file):
#    npx @redocly/cli bundle src/main/resources/openapi/openapi.yaml -o src/main/resources/openapi/bundled.yaml
#
# 🧪 Validate command:
#    npx @redocly/cli lint src/main/resources/openapi/openapi.yaml

openapi: 3.1.0

info:
  title: SharingFileWeb API
  version: "1.0.0"
  description: |
    API Documentation cho hệ thống SharingFileWeb — nền tảng lưu trữ và chia sẻ file.
    Hỗ trợ: tài khoản local, đăng nhập Google, upload chunked, chia sẻ nội bộ,
    link chia sẻ công khai (có/mật khẩu), Backblaze B2 storage, thùng rác, thông báo.
  contact:
    name: SharingFileWeb Team
    url: https://sharingfileweb.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.sharingfileweb.com
    description: Production server

# ─── Security Scheme ────────────────────────────────────────────────────────────
security:
  - bearerAuth: []

components:

  # ─── Security ───────────────────────────────────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token nhận được từ API `/api/auth/signin`.
        Format: `Authorization: Bearer <accessToken>`

  # ─── Schemas ────────────────────────────────────────────────────────────────
  schemas:

    # ── Auth ─────────────────────────────────────────────────────────────────
    LoginRequest:
      $ref: './components/schemas/Auth.yaml#/LoginRequest'
    SignupRequest:
      $ref: './components/schemas/Auth.yaml#/SignupRequest'
    GoogleLoginRequest:
      $ref: './components/schemas/Auth.yaml#/GoogleLoginRequest'
    TokenRefreshRequest:
      $ref: './components/schemas/Auth.yaml#/TokenRefreshRequest'
    JwtResponse:
      $ref: './components/schemas/Auth.yaml#/JwtResponse'
    TokenRefreshResponse:
      $ref: './components/schemas/Auth.yaml#/TokenRefreshResponse'

    # ── File ─────────────────────────────────────────────────────────────────
    FileResponse:
      $ref: './components/schemas/File.yaml#/FileResponse'
    ShareFileRequest:
      $ref: './components/schemas/File.yaml#/ShareFileRequest'
    RenameFileRequest:
      $ref: './components/schemas/File.yaml#/RenameFileRequest'
    UploadStatusResponse:
      $ref: './components/schemas/File.yaml#/UploadStatusResponse'
    DownloadUrlResponse:
      $ref: './components/schemas/File.yaml#/DownloadUrlResponse'

    # ── Folder ────────────────────────────────────────────────────────────────
    FolderResponse:
      $ref: './components/schemas/Folder.yaml#/FolderResponse'
    CreateFolderRequest:
      $ref: './components/schemas/Folder.yaml#/CreateFolderRequest'
    UpdateFolderRequest:
      $ref: './components/schemas/Folder.yaml#/UpdateFolderRequest'
    ResolvePathRequest:
      $ref: './components/schemas/Folder.yaml#/ResolvePathRequest'

    # ── Sharing ───────────────────────────────────────────────────────────────
    InternalShareRequest:
      $ref: './components/schemas/Sharing.yaml#/InternalShareRequest'
    UpdatePermissionRequest:
      $ref: './components/schemas/Sharing.yaml#/UpdatePermissionRequest'
    CreateShareLinkRequest:
      $ref: './components/schemas/Sharing.yaml#/CreateShareLinkRequest'
    UpdateShareLinkRequest:
      $ref: './components/schemas/Sharing.yaml#/UpdateShareLinkRequest'
    ShareLinkResponse:
      $ref: './components/schemas/Sharing.yaml#/ShareLinkResponse'
    SharedAccessResponse:
      $ref: './components/schemas/Sharing.yaml#/SharedAccessResponse'

    # ── User ──────────────────────────────────────────────────────────────────
    UserProfileResponse:
      $ref: './components/schemas/User.yaml#/UserProfileResponse'
    UpdateProfileRequest:
      $ref: './components/schemas/User.yaml#/UpdateProfileRequest'
    ChangePasswordRequest:
      $ref: './components/schemas/User.yaml#/ChangePasswordRequest'
    StorageUsageResponse:
      $ref: './components/schemas/User.yaml#/StorageUsageResponse'
    UserSummary:
      $ref: './components/schemas/User.yaml#/UserSummary'

    # ── Dashboard / Misc ─────────────────────────────────────────────────────
    RecentFileDTO:
      $ref: './components/schemas/Dashboard.yaml#/RecentFileDTO'
    StorageCategoryDTO:
      $ref: './components/schemas/Dashboard.yaml#/StorageCategoryDTO'
    TrashItemsResponse:
      $ref: './components/schemas/Dashboard.yaml#/TrashItemsResponse'
    NotificationResponse:
      $ref: './components/schemas/Dashboard.yaml#/NotificationResponse'
    UnreadCountResponse:
      $ref: './components/schemas/Dashboard.yaml#/UnreadCountResponse'

    # ── Common ────────────────────────────────────────────────────────────────
    StandardResponse:
      $ref: './components/schemas/Common.yaml#/StandardResponse'
    Error400:
      $ref: './components/schemas/Common.yaml#/Error400'
    Error401:
      $ref: './components/schemas/Common.yaml#/Error401'
    Error403:
      $ref: './components/schemas/Common.yaml#/Error403'
    Error404:
      $ref: './components/schemas/Common.yaml#/Error404'
    Error500:
      $ref: './components/schemas/Common.yaml#/Error500'
    PageMetadata:
      $ref: './components/schemas/Common.yaml#/PageMetadata'

# ─── Tags (Grouping) ─────────────────────────────────────────────────────────────
tags:
  - name: Authentication
    description: Đăng nhập, đăng ký, làm mới token, đăng xuất. Tất cả endpoint **PUBLIC**.
  - name: File Management
    description: Upload chunked, download, rename, share, delete, admin CRUD. Yêu cầu **Bearer JWT**.
  - name: Folder Management
    description: CRUD thư mục, breadcrumb, children listing. Yêu cầu **Bearer JWT**.
  - name: Sharing
    description: Chia sẻ nội bộ (email) và tạo link public. Yêu cầu **Bearer JWT**.
  - name: Public Sharing
    description: Truy cập file qua link công khai — **PUBLIC**, không cần đăng nhập.
  - name: User Profile
    description: Profile, đổi mật khẩu, storage, admin user management. Yêu cầu **Bearer JWT**.
  - name: Dashboard
    description: Thống kê dung lượng và file gần đây. Yêu cầu **Bearer JWT**.
  - name: Trash Management
    description: Xóa mềm, khôi phục, dọn sạch thùng rác. Yêu cầu **Bearer JWT**.
  - name: Notifications
    description: Danh sách thông báo, đánh dấu đã đọc. Yêu cầu **Bearer JWT**.
  - name: Subscription
    description: Quản lý gói cước (nâng cấp PRO). Yêu cầu **Bearer JWT**.

# ─── Paths ───────────────────────────────────────────────────────────────────────

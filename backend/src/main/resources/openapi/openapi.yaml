  /api/auth/signup:
    $ref: './paths/Auth.yaml#/paths/~1signup'
  /api/auth/refreshtoken:
    $ref: './paths/Auth.yaml#/paths/~1refreshtoken'
  /api/auth/logout:
    $ref: './paths/Auth.yaml#/paths/~1logout'

  # ── Files ──────────────────────────────────────────────────────────────────
  /api/files:
    $ref: './paths/Files.yaml#/paths/~1'
  /api/files/recent:
    $ref: './paths/Files.yaml#/paths/~1recent'
  /api/files/shared:
    $ref: './paths/Files.yaml#/paths/~1shared'
  /api/files/upload/chunk:
    $ref: './paths/Files.yaml#/paths/~1upload~1chunk'
  /api/files/upload/status:

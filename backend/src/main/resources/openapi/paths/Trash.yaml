paths:
  /:
    get:
      tags: [Trash Management]
      summary: Lấy danh sách tệp/thư mục trong thùng rác
      description: Lấy toàn bộ tệp và thư mục đã bị xóa mềm của người dùng.
      operationId: getTrashItems
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../components/schemas/Common.yaml#/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../components/schemas/Dashboard.yaml#/TrashItemsResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error401'

  /restore/{type}/{id}:
    put:
      tags: [Trash Management]
      summary: Khôi phục dữ liệu
      description: Khôi phục tệp hoặc thư mục từ thùng rác về vị trí ban đầu.
      operationId: restoreItem
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [file, folder]
          description: Loại dữ liệu cần khôi phục
          example: file
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID của tệp hoặc thư mục
          example: "64f1a2b3c4d5e6f7a8b9c0d1"
      responses:
        '200':
          description: Khôi phục thành công
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/StandardResponse'
        '400':
          description: Dữ liệu không tồn tại trong thùng rác
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error400'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error401'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error404'

  /permanent/{type}/{id}:
    delete:
      tags: [Trash Management]
      summary: Xóa vĩnh viễn một mục
      description: Xóa hoàn toàn một tệp hoặc thư mục khỏi thùng rác.
      operationId: deletePermanentItem
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [file, folder]
          description: Loại dữ liệu cần xóa
          example: file
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID của tệp hoặc thư mục
          example: "64f1a2b3c4d5e6f7a8b9c0d1"
      responses:
        '200':
          description: Đã xóa vĩnh viễn
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/StandardResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error401'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error404'

  /empty:
    delete:
      tags: [Trash Management]
      summary: Dọn sạch thùng rác
      description: Xóa vĩnh viễn toàn bộ tệp và thư mục trong thùng rác.
      operationId: emptyTrash
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dọn sạch thành công
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/StandardResponse'
        '400':
          description: Lỗi khi dọn thùng rác
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error400'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '../components/schemas/Common.yaml#/Error401'
